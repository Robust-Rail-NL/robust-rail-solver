# Deliberately a short search: the plan graph that triggers #11 is built by the
# tabu phase within the first few iterations, so a long budget would only make
# the test slow without making it more likely to catch anything.
Mode: "Standard"
Seed: 1

TabuSearch:
  Iterations: 40
  IterationsUntilReset: 100
  TabuListLength: 16
  Bias: 0.5

SimulatedAnnealing:
  MaxDuration: 10
  StopWhenFeasible: true
  IterationsUntilReset: 150000
  T: 15
  A: 0.97
  Q: 2000
  Reset: 2000
  Bias: 0.2
  IntensifyOnImprovement: false
