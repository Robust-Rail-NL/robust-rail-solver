# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

# edge is the fast/unvetted image channel (see CONTRIBUTING.md) — it only
# ever gains work via direct `git merge --no-ff`, never a GitHub PR targeting
# it, so it's only listed under push, not pull_request.
on:
  push:
    branches: [ "main", "dev", "edge" ]
  pull_request:
    branches: [ "main", "dev" ]
  workflow_dispatch:

jobs:
  check_formatting:
    runs-on: ubuntu-latest
    name: Check Formatting
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v5
    - run: |
        dotnet tool restore
        dotnet csharpier check ./ServiceSiteScheduling/
        dotnet csharpier check ./Tests/
  build:
    # Both architectures the hip image is published for; several developers
    # work on arm64. .NET abstracts away most of the difference, so this is
    # cheaper insurance than the evaluator's matrix rather than an equally
    # likely place to find something — but the solver is where the
    # wall-clock-bounded local search lives, and "it runs at all on arm64" is
    # worth knowing rather than assuming.
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    name: Build and test (${{ matrix.runner }})
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v5
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 8.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore
    # Smoke test: with no --config, HIP parses and plans the example
    # Kleine Binckhorst fixture, whose location.json and scenario.json are
    # committed. Paths are relative, so this step depends on the
    # working-directory below.
    - name: Run
      working-directory: ./ServiceSiteScheduling
      run: dotnet run --no-build --verbosity normal --project HIP.csproj
    - name: Test
      run: dotnet run --no-build --project Tests/ServiceSiteScheduling.Tests.csproj
