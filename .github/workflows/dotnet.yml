# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  check_formatting:
    runs-on: ubuntu-latest
    name: Check Formatting
    steps:
    - uses: actions/checkout@v4
    - run: |
        dotnet tool restore
        dotnet csharpier check ./ServiceSiteScheduling/
        dotnet csharpier check ./Tests/
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore
    - name: Run
      working-directory: ./ServiceSiteScheduling
      run: dotnet run --no-build --verbosity normal --project HIP.csproj
    - name: Test
      run: dotnet run --no-build --project Tests/ServiceSiteScheduling.Tests.csproj
